name: IBKR 每日资产同步

on:
  schedule:
    # 北京时间 10:00 / 11:30 / 13:00 三次触发
    # （UTC 02:00 / 03:30 / 05:00，中国 UTC+8 无夏令时）
    - cron: "0 2 * * *"    # 北京 10:00
    - cron: "30 3 * * *"   # 北京 11:30
    - cron: "0 5 * * *"    # 北京 13:00
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新同步（忽略今日已同步标记）"
        type: boolean
        default: false

permissions:
  contents: write        # 允许把更新后的 Asset_parsed.json 提交回仓库

concurrency:
  group: ibkr-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 单次运行轻量：1 次查询 +（失败则 30s 后重试 1 次）；留 10 分钟余量足够
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 用仓库默认 token 提交，避免 PAT 额外配置
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行 IBKR 1day 解析脚本（失败重试 1 次）
        env:
          IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
          IBKR_QUERY_ID_1DAY: ${{ secrets.IBKR_QUERY_ID_1DAY }}
          IBKR_QUERY_ID_ASSET: ${{ secrets.IBKR_QUERY_ID_ASSET }}
          JSON_PATH: ${{ github.workspace }}/Asset_parsed.json
          FORCE_ARG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          if python parse_ibkr_asset1day.py $FORCE_ARG; then
            echo "IBKR 同步成功"
          else
            echo "首次运行失败，30 秒后重试 1 次..."
            sleep 30
            python parse_ibkr_asset1day.py $FORCE_ARG
          fi

      - name: 提交并推送更新后的 JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Asset_parsed.json
          # 仅当 JSON 有变化才提交（避免无谓的空提交触发 Pages 重建）
          if git diff --cached --quiet; then
            echo "Asset_parsed.json 无变化，跳过提交"
          else
            git commit -m "chore: 每日同步 IBKR 资产快照 $(date +%Y-%m-%d)"
            git push
          fi
