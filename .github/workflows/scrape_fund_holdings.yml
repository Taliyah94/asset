name: 抓取基金季报

# 手动触发：在 GitHub 仓库的 Actions 标签页点「Run workflow」即可。
# 也可按需打开下方 schedule（每季度自动抓取）。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "要抓取的基金代码（逗号分隔，留空则用脚本默认列表）"
        required: false
        default: ""
      output:
        description: "输出 JSON 的相对路径"
        required: false
        default: "fund_holdings.json"

  # 每季度自动抓取（取消注释即启用）：
  # 季末后第 5 天 16:00 UTC ≈ 北京时间次日 00:00
  # schedule:
  #   - cron: "0 16 5 2,5,8,11 *"

permissions:
  contents: write   # 用于把抓取结果提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取基金季报
        run: |
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          ARGS="-o $OUT"
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS="$ARGS --codes ${{ github.event.inputs.codes }}"
          fi
          python3 fund_holdings.py $ARGS

      - name: 提交结果（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新基金季报 $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
