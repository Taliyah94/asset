name: 抓取基金持仓与净值

# 手动触发：在 GitHub 仓库的 Actions 标签页点「Run workflow」即可。
# 每日自动抓取：净值(nav)与季报前十大持仓(items) 一并刷新。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "要抓取的基金代码（逗号分隔，留空则用脚本默认列表）"
        required: false
        default: ""
      output:
        description: "输出 JSON 的相对路径"
        required: false
        default: "fund_holdings.json"

  # 每日自动抓取：美东时间 09:30（美股开盘，前一日净值已确定发布）。
  # GitHub cron 仅支持 UTC 且不自动随夏令时切换：
  #   夏令时 EDT(3–11月) 美东9:30 = UTC 13:30  -> 下方取值
  #   冬令时 EST         美东9:30 = UTC 14:30  -> 需改为 "30 14 * * *"
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write   # 用于把抓取结果提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取基金季报
        run: |
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          ARGS="-o $OUT"
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS="$ARGS --codes ${{ github.event.inputs.codes }}"
          fi
          python3 fund_holdings.py $ARGS

      - name: 提交结果（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT="${{ github.event.inputs.output || 'fund_holdings.json' }}"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新基金持仓与净值 $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
